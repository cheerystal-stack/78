<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d24">

  <title>78</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app" id="homeScreen">

    <div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

    <header class="cover">

  <div class="arcana-code">
    <span>XXII</span>
    <span class="star">✦</span>
    <span>LVI</span>
  </div>

  <div class="ornament">☾　✦　☽</div>

  <div class="title-frame">
    <span class="title-line left"></span>
    <span class="title-diamond">◇</span>

    <h1>78</h1>

    <span class="title-diamond">◇</span>
    <span class="title-line right"></span>
  </div>

  <p class="subtitle">
    observe the coincidence.
  </p>

  <div class="gold-line"></div>

</header>


    <section class="main-menu">

  <button class="main-button">
    <span class="button-symbol">✦</span>
    <span>NEW READING</span>
  </button>

  <button class="main-button" id="oneCardBtn">
    <span class="button-symbol">☾</span>
    <span>ONE CARD</span>
  </button>

</section>


    <nav class="sub-menu">

      <button>HISTORY</button>

      <span class="nav-star">✦</span>

      <button>CARDS</button>

    </nav>


    <footer>
      <span>XXII</span>
      <span>•</span>
      <span>LVI</span>
    </footer>

    </main>
  
    <section class="one-card-screen" id="oneCardScreen">

  <button class="back-button" id="backHome">
    ← HOME
  </button>

  <div class="screen-heading">
    <div class="small-symbol">☾　✦　☽</div>
    <h2>ONE CARD</h2>
    <p>one question. one card.</p>
  </div>

  <div class="draw-options">

    <button class="draw-option">
      <span class="option-symbol">✦</span>
      <strong>PHYSICAL</strong>
      <small>draw from your deck</small>
    </button>

    <button class="draw-option" id="randomBtn">
      <span class="option-symbol">☾</span>
      <strong>RANDOM</strong>
      <small>let 78 choose</small>
    </button>

  </div>

</section>
    
  <section class="result-screen" id="resultScreen">

  <button class="back-button" id="backOneCard">
    ← ONE CARD
  </button>

  <div class="result-heading">
    <div class="small-symbol">☾　✦　☽</div>
    <p>THE CARD HAS SPOKEN</p>
  </div>

  <div class="tarot-card" id="tarotCard">

    <div class="card-roman" id="cardRoman"></div>

    <div class="card-symbol">✦</div>

    <div class="card-name" id="cardName"></div>

    <div class="card-position" id="cardPosition"></div>

    <div class="card-symbol bottom">☾　✦　☽</div>

  </div>

    <!-- CARD MEANING -->
<div class="card-reading">

  <button class="read-card-button" id="readCardBtn">
    ✦ READ THE CARD
  </button>

  <div class="card-meaning" id="cardMeaning">

    <div class="meaning-block">
      <p class="meaning-label">KEYWORDS</p>
      <p class="meaning-text" id="meaningKeywords"></p>
    </div>

    <div class="meaning-block">
      <p class="meaning-label">MESSAGE</p>
      <p class="meaning-text" id="meaningMessage"></p>
    </div>

    <div class="meaning-block">
      <p class="meaning-label">LOVE</p>
      <p class="meaning-text" id="meaningLove"></p>
    </div>

    <div class="meaning-block">
      <p class="meaning-label">WORK</p>
      <p class="meaning-text" id="meaningWork"></p>
    </div>

  </div>

</div>

  <button class="draw-again" id="drawAgain">
    ✦ DRAW AGAIN
  </button>

</section>

 <!-- QUESTION & MOOD SCREEN -->
<section class="question-screen" id="questionScreen">

  <button class="back-button" id="backQuestion">
    ← ONE CARD
  </button>

  <div class="screen-heading">
    <div class="small-symbol">☾　✦　☽</div>
    <h2>BEFORE YOU DRAW</h2>
    <p>leave a trace of this moment.</p>
  </div>

  <div class="question-area">

    <label for="questionInput">YOUR QUESTION</label>

    <textarea
      id="questionInput"
      placeholder="what do you want to ask?"
      rows="3"
    ></textarea>

    <p class="optional-text">
      optional — you can leave it blank.
    </p>

  </div>


  <div class="mood-area">

    <p class="mood-title">HOW DO YOU FEEL?</p>

    <div class="mood-buttons">

      <button type="button" class="mood-chip" data-mood="不安">
        不安
      </button>

      <button type="button" class="mood-chip" data-mood="期待">
        期待
      </button>

      <button type="button" class="mood-chip" data-mood="嬉しい">
        嬉しい
      </button>

      <button type="button" class="mood-chip" data-mood="怒り">
        怒り
      </button>

      <button type="button" class="mood-chip" data-mood="嫉妬">
        嫉妬
      </button>

      <button type="button" class="mood-chip" data-mood="迷い">
        迷い
      </button>

      <button type="button" class="mood-chip" data-mood="寂しい">
        寂しい
      </button>

      <button type="button" class="mood-chip" data-mood="平常">
        平常
      </button>

    </div>

  </div>


  <button class="draw-from-question" id="drawFromQuestion">
    ✦ DRAW
  </button>

</section>
  
<script src="app.js?V-3"></script>
  
</body>
</html>
